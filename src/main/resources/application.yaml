server:
  port: 8080

spring:
  config:
    import: optional:classpath:application-secret.properties

  jackson:
    property-naming-strategy: SNAKE_CASE

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DEV_DB_URL}
    username: ${DEV_DB_USERNAME}
    password: ${DEV_DB_PASSWORD}

    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 20000
      idle-timeout: 30000
      max-lifetime: 1800000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true

  data:
    redis:
      host: ${DEV_REDIS_HOST}
      port: ${DEV_REDIS_PORT}
      password: ${DEV_REDIS_PASSWORD}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS}

jwt:
  secret: ${JWT_SECRET}
  access-token-expire-time: ${JWT_ACCESS_TOKEN_EXPIRE_TIME:3600000}
  refresh-token-expire-time: ${JWT_REFRESH_TOKEN_EXPIRE_TIME:1209600000}

livekit:
  url: ${LIVEKIT_URL:wss://example.livekit.invalid}
  api-key: ${LIVEKIT_API_KEY:devkey}
  api-secret: ${LIVEKIT_API_SECRET:01234567890123456789012345678901}

github:
  token:
    encryption:
      key: ${GITHUB_TOKEN_ENCRYPTION_KEY}
aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION:ap-northeast-2}
    access-key: ${AWS_S3_ACCESS_KEY}
    secret-key: ${AWS_S3_SECRET_KEY}

audio:
  # Ubuntu: /usr/bin/ffprobe 또는 PATH의 ffprobe
  # macOS(Homebrew): /opt/homebrew/bin/ffprobe
  ffprobe-command: ${AUDIO_FFPROBE_COMMAND:/opt/homebrew/bin/ffprobe}

fast:
  api:
    base-url: ${FAST_API_BASE_URL}
