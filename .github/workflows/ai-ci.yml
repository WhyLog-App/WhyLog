# /*
#  * 동작 방식
#  * - ai/** 경로가 바뀐 PR에서만 트리거된다 (기본 types: opened, synchronize, reopened)
#  * - synchronize 덕분에 PR을 열 때뿐 아니라 그 PR에 push할 때마다 재실행된다
#  * - defaults.run.working-directory 로 모든 run 스텝이 ai/ 기준으로 실행된다
#  * - uv로 Python과 의존성을 준비한 뒤 Ruff 린트·포맷 검사와 Docker 빌드를 수행한다
#  * - quality 단계를 필수 검사로 지정하면 브랜치 보호 규칙으로 PR 머지를 막을 수 있다
#  */

name: AI CI

on:
  pull_request:
    paths:
      - 'ai/**'

defaults:
  run:
    working-directory: ai

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: ai/pyproject.toml

      - name: Install dependencies
        run: uv sync --frozen --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Build Docker image
        run: docker build -t fastapi .
