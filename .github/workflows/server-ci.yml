# /*
#  * 동작 방식
#  * - server/** 경로가 바뀐 PR에서만 트리거된다 (기본 types: opened, synchronize, reopened)
#  * - synchronize 덕분에 PR을 열 때뿐 아니라 그 PR에 push할 때마다 재실행된다
#  * - defaults.run.working-directory 로 모든 run 스텝이 server/ 기준으로 실행된다
#  * - JDK 17(Temurin) 설치 후 ./gradlew clean build 로 컴파일 + 테스트 + 패키징을 한 번에 수행한다
#  * - build 단계가 실패하면 기계 검사 차단으로 PR 머지가 막힌다
#  *
#  * 남은 작업
#  * - web-ci.yml / ai-ci.yml 과 함께 상완이 .github/workflows/ci.yml 하나로 통합 예정
#  * - AI 리뷰 job이 아직 없음. 기계 검사(build) 통과 후 needs 로 연결되는 job을 상완이 추가한다
#  * - 현재 테스트(ServerApplicationTests)는 @SpringBootTest 가 주석 처리돼 있어 DB/Redis 없이도 통과한다.
#  *   나중에 컨텍스트 로딩 테스트를 활성화하면 DEV_DB_URL 등 GitHub secrets 를 이 워크플로에 추가해야 한다
#  */

name: Server CI

on:
  pull_request:
    paths:
      - 'server/**'

defaults:
  run:
    working-directory: server

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Build with Gradle
        run: ./gradlew clean build
