name: CD

on:
  pull_request:
    branches:
      - develop
    types:
      - closed

env:
  IMAGE_NAME: whylog/whylog-spring
  IMAGE_TAG: latest
  CONTAINER_NAME: spring-app

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout merge commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.event.pull_request.merge_commit_sha }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT || 22 }}
          script: |
            set -e

            cd ${{ secrets.EC2_DEPLOY_PATH }}

            docker compose --env-file .env down || true
            docker rm -f ${{ env.CONTAINER_NAME }} || true
            docker image rm ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} || true
            docker compose --env-file .env pull
            docker compose --env-file .env up -d
            docker image prune -f
            docker ps --filter "name=${{ env.CONTAINER_NAME }}"
